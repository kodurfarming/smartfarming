<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14602b">
<title>SmartFarm AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6ec;--card:#fff;--ink:#17301e;--mute:#5b6b5e;--line:#d9e4d1;--g:#14602b;--g2:#2e8b45;--sky:#2b7bb9;--warn:#b4691a;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101912;--card:#1a261d;--ink:#e6f0e2;--mute:#9db09f;--line:#2c3b2f}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#cfd9c8;color:var(--ink);font:16px/1.5 'Noto Sans Telugu',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
button{font:inherit;color:inherit;cursor:pointer}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(180deg,#8cc9e8 0%,#4f9c4a 55%,#14602b 100%);padding:24px}
.logo{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:58px;border:6px solid var(--g);box-shadow:0 8px 24px #0003}
.splash h1{font-size:38px;margin:18px 0 4px;color:#fff;text-shadow:0 2px 8px #0005}
.spin{width:34px;height:34px;border:4px solid #fff5;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;margin-top:40px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.login{padding:36px 22px;background:linear-gradient(180deg,#e2f1d6,var(--bg) 45%);min-height:100vh;text-align:center}
.login .logo{width:92px;height:92px;font-size:44px;margin:0 auto}
.login h1{color:var(--g);margin:10px 0 0;font-size:32px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:700;margin:6px 0}
.btn.o{background:var(--card);color:var(--g);border:2px solid var(--g)}
.lnk{background:none;border:0;color:var(--g);font-weight:600;margin-top:12px}
.err{color:var(--bad);min-height:1.5em;font-size:14px}
.hd{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px}
.hd button{background:none;border:0;color:#fff;font-size:22px;padding:0 4px}
.hero{background:linear-gradient(135deg,#14602b,#3b9a4e);color:#fff;padding:22px 18px 40px;border-radius:0 0 28px 28px;position:relative}
.hero h2{margin:0;font-size:26px}.hero p{margin:4px 0 0;max-width:60%}.hero i{position:absolute;right:18px;bottom:14px;font-size:62px;font-style:normal}
.pad{padding:16px 16px 120px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-26px;position:relative}
.tile{border:0;border-radius:18px;padding:20px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;color:#14301c;min-height:128px;justify-content:center;box-shadow:0 3px 10px #0001}
.tile span{font-size:38px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:18px}
.rec{background:#e4f2d6;color:#14301c;border-color:#bfdba4}
.rec b{font-size:26px;display:block}
.ok{list-style:none;padding:0;margin:8px 0 0}.ok li:before{content:"✔ ";color:var(--g2);font-weight:700}
.alert{background:#fde3df;color:#7a2018;border-color:#f3b8b0}
.adv{background:#fdf0d8;color:#6b4208;border-color:#f0d49a}
.big{font-size:54px;font-weight:800;line-height:1}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st div{border-radius:14px;padding:14px 10px;text-align:center;color:#14301c;font-weight:600}
.st b{display:block;font-size:22px}
.chips{display:flex;gap:8px;margin-bottom:8px}
.chips button{flex:1;padding:8px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.up{border:2px dashed var(--g2);border-radius:16px;padding:22px;text-align:center;display:block;cursor:pointer;font-weight:700;color:var(--g)}
.up input{display:none}
.tipc{display:flex;gap:12px;align-items:center}.tipc span{font-size:30px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center}
nav button span{font-size:22px}nav button.on{color:var(--g);font-weight:700}
.fab{position:fixed;right:max(14px,calc(50% - 226px));bottom:calc(76px + env(safe-area-inset-bottom,0px));border:0;border-radius:99px;background:var(--sky);color:#fff;padding:12px 18px;font-weight:700;box-shadow:0 6px 20px #0004;z-index:3}
.chat{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);z-index:9;max-width:480px;margin:0 auto}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--g);color:#fff}.m.b{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.m button{display:block;margin-top:6px;background:none;border:0;color:var(--sky);padding:0;font-size:14px}
.sug{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px}
.sug button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px}
.inp{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.inp input{margin:0;flex:1}.inp button{border:0;border-radius:10px;padding:0 14px;background:var(--g);color:#fff;font-weight:700}.inp .mic{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"><div id="scr"></div><nav id="nav" hidden></nav><button class="fab" id="fab" hidden></button></div>
<div id="chat" class="chat" hidden>
<div class="hd"><span id="c-t" style="flex:1"></span><button id="cx" aria-label="Close">✕</button></div>
<div class="msgs" id="msgs" aria-live="polite"></div><div class="sug" id="sug"></div>
<div class="inp"><button class="mic" id="mic" aria-label="Speak">🎤</button><input id="q" autocomplete="off"><button id="send"></button></div></div>
