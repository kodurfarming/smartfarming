<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14602b">
<title>SmartFarm AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6ec;--card:#fff;--ink:#17301e;--mute:#5b6b5e;--line:#d9e4d1;--g:#14602b;--g2:#2e8b45;--sky:#2b7bb9;--warn:#b4691a;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101912;--card:#1a261d;--ink:#e6f0e2;--mute:#9db09f;--line:#2c3b2f}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#cfd9c8;color:var(--ink);font:16px/1.5 'Noto Sans Telugu',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
button{font:inherit;color:inherit;cursor:pointer}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(180deg,#8cc9e8 0%,#4f9c4a 55%,#14602b 100%);padding:24px}
.logo{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:58px;border:6px solid var(--g);box-shadow:0 8px 24px #0003}
.splash h1{font-size:38px;margin:18px 0 4px;color:#fff;text-shadow:0 2px 8px #0005}
.spin{width:34px;height:34px;border:4px solid #fff5;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;margin-top:40px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.login{padding:36px 22px;background:linear-gradient(180deg,#e2f1d6,var(--bg) 45%);min-height:100vh;text-align:center}
.login .logo{width:92px;height:92px;font-size:44px;margin:0 auto}
.login h1{color:var(--g);margin:10px 0 0;font-size:32px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:700;margin:6px 0}
.btn.o{background:var(--card);color:var(--g);border:2px solid var(--g)}
.lnk{background:none;border:0;color:var(--g);font-weight:600;margin-top:12px}
.err{color:var(--bad);min-height:1.5em;font-size:14px}
.hd{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px}
.hd button{background:none;border:0;color:#fff;font-size:22px;padding:0 4px}
.hero{background:linear-gradient(135deg,#14602b,#3b9a4e);color:#fff;padding:22px 18px 40px;border-radius:0 0 28px 28px;position:relative}
.hero h2{margin:0;font-size:26px}.hero p{margin:4px 0 0;max-width:60%}.hero i{position:absolute;right:18px;bottom:14px;font-size:62px;font-style:normal}
.pad{padding:16px 16px 120px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-26px;position:relative}
.tile{border:0;border-radius:18px;padding:20px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;color:#14301c;min-height:128px;justify-content:center;box-shadow:0 3px 10px #0001}
.tile span{font-size:38px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:18px}
.rec{background:#e4f2d6;color:#14301c;border-color:#bfdba4}
.rec b{font-size:26px;display:block}
.ok{list-style:none;padding:0;margin:8px 0 0}.ok li:before{content:"✔ ";color:var(--g2);font-weight:700}
.alert{background:#fde3df;color:#7a2018;border-color:#f3b8b0}
.adv{background:#fdf0d8;color:#6b4208;border-color:#f0d49a}
.big{font-size:54px;font-weight:800;line-height:1}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st div{border-radius:14px;padding:14px 10px;text-align:center;color:#14301c;font-weight:600}
.st b{display:block;font-size:22px}
.chips{display:flex;gap:8px;margin-bottom:8px}
.chips button{flex:1;padding:8px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.up{border:2px dashed var(--g2);border-radius:16px;padding:22px;text-align:center;display:block;cursor:pointer;font-weight:700;color:var(--g)}
.up input{display:none}
.tipc{display:flex;gap:12px;align-items:center}.tipc span{font-size:30px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center}
nav button span{font-size:22px}nav button.on{color:var(--g);font-weight:700}
.fab{position:fixed;right:max(14px,calc(50% - 226px));bottom:calc(76px + env(safe-area-inset-bottom,0px));border:0;border-radius:99px;background:var(--sky);color:#fff;padding:12px 18px;font-weight:700;box-shadow:0 6px 20px #0004;z-index:3}
.chat{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);z-index:9;max-width:480px;margin:0 auto}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--g);color:#fff}.m.b{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.m button{display:block;margin-top:6px;background:none;border:0;color:var(--sky);padding:0;font-size:14px}
.sug{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px}
.sug button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px}
.inp{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.inp input{margin:0;flex:1}.inp button{border:0;border-radius:10px;padding:0 14px;background:var(--g);color:#fff;font-weight:700}.inp .mic{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.tag.best{background:#d6efc0;color:#14501f}.tag.good{background:#e6f2c4;color:#3a4a10}.tag.fair{background:#fdf0d8;color:#6b4208}.tag.low{background:#fde3df;color:#7a2018}.tag.no{background:#fde3df;color:#7a2018}
.rk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.rk b{flex:1}.rk small{color:var(--mute);display:block;font-weight:400}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span:first-child{color:var(--mute)}
</style>
</head>
<body>
<div id="app"><div id="scr"></div><nav id="nav" hidden></nav><button class="fab" id="fab" hidden></button></div>
<div id="chat" class="chat" hidden>
<div class="hd"><span id="c-t" style="flex:1"></span><button id="cx" aria-label="Close">✕</button></div>
<div class="msgs" id="msgs" aria-live="polite"></div><div class="sug" id="sug"></div>
<div class="inp"><button class="mic" id="mic" aria-label="Speak">🎤</button><input id="q" autocomplete="off"><button id="send"></button></div></div>

h+='<div class="card" style="background:#dde6fb;color:#142a5c"><div class="big">'+ico(c.weather_code)+" "+Math.round(c.temperature_2m)+'°C</div><p>📍 Kodur · '+tx("hum")+" "+c.relative_humidity_2m+"% · "+tx("wind")+" "+Math.round(c.wind_speed_10m)+' km/h</p></div><div class="card '+(x.rain?"alert":"adv")+'"><b>⚠️ '+tx("adv")+"</b><p>"+wxMsg()+"</p></div><h3>"+tx("n3")+'</h3><div class="row3">';
for(var i=1;i<4&&i<d.time.length;i++)h+="<div><b>"+new Date(d.time[i]+"T12:00:00").toLocaleDateString(lc,{weekday:"short"})+"</b><br>"+ico(d.weather_code[i])+"<br><b>"+Math.round(d.temperature_2m_max[i])+"°/"+Math.round(d.temperature_2m_min[i])+"°</b><br><small>💧"+d.precipitation_probability_max[i]+"%</small></div>";
return h+'</div><p style="color:var(--mute);font-size:14px">'+tx("live")+" · Open-Meteo</p></div>"},
dash:function(){var x=wxr(),h=hd(tx("dT"))+'<div class="pad"><div class="st"><div style="background:#d8efc3">🌱<b>'+(S.crp?nm(S.crp):tx("none"))+"</b>"+tx("dc")+'</div><div style="background:#d3e5fa">💧<b>'+(S.crp&&ready()?irr(S.crp)+" "+tx("dd"):tx("none"))+"</b>"+tx("dn")+'</div><div style="background:#fbdcc3">📋<b>'+S.hist.length+"</b>"+tx("dk")+'</div><div style="background:#e2dbf5">⛅<b>'+(!x.ok?tx("none"):x.rain||x.hot?"⚠️":"✔")+"</b>"+tx("da")+"</div></div><h3>"+tx("rc")+"</h3>";
S.hist.slice().reverse().forEach(function(q){h+='<div class="card">🌱 '+(C[q.c]?nm(q.c):"")+"<br><small>"+q.d+"</small></div>"});return h+"</div>"},
tips:function(){var h=hd(tx("tT"))+'<div class="pad"><div class="chips">'+[["all","all"],["organic","org"],["general","genr"]].map(function(c){return '<button data-tf="'+c[0]+'" class="'+(S.tf==c[0]?"on":"")+'">'+tx(c[1])+"</button>"}).join("")+"</div>";
TIPS.forEach(function(t){if(S.tf=="all"||S.tf==t[0])h+='<div class="card tipc"><span>'+(t[0]=="organic"?"🌿":"🌾")+"</span><div>"+(S.L=="en"?t[1]:t[2])+"</div></div>"});return h+"</div>"},
prof:function(){var u=S.user||{};return hd(tx("pT"))+'<div class="pad"><div class="card tipc"><span style="font-size:44px">👤</span><div><b>'+esc(u.guest?tx("gst"):u.name||"")+"</b><br><small>"+esc(u.email||"")+'</small></div></div><div class="card"><b>'+tx("lang")+'</b><div class="chips" style="margin-top:8px"><button data-l="te" class="'+(S.L=="te"?"on":"")+'">తెలుగు</button><button data-l="en" class="'+(S.L=="en"?"on":"")+'">English</button></div></div><button class="btn o" data-act="logout">'+tx("lo")+'</button><p style="color:var(--mute);font-size:14px">'+tx("abt")+"</p></div>"}};
function draw(keep){
if(!S.user&&S.scr!="splash"&&S.scr!="login")S.scr="login";
if(S.scr=="guide"&&!S.crp)S.scr="crop";
$("scr").innerHTML=V[S.scr]();
var app=S.user&&S.scr!="splash"&&S.scr!="login";$("nav").hidden=!app;$("fab").hidden=!app;
if(app){var ic=["🏠","📊","💡","👤"],gs=["home","dash","tips","prof"];$("nav").innerHTML=tx("nav").map(function(n,i){return '<button data-go="'+gs[i]+'" class="'+(S.scr==gs[i]?"on":"")+'"><span>'+ic[i]+"</span>"+n+"</button>"}).join("");$("fab").textContent=tx("ask")}
$("c-t").textContent="🤖 "+tx("ct");$("q").placeholder=tx("ph2");$("send").textContent=tx("send");
$("sug").innerHTML=tx("sg").map(function(s){return "<button>"+s+"</button>"}).join("");
document.documentElement.lang=S.L;if(!keep)scrollTo(0,0)}
function go(s){S.scr=s;save();draw();if((s=="wx"||s=="home"||s=="dash")&&WXS!="ok"&&WXS!="load")wxLoad()}
function summary(){var l=[];if(S.crp)l.push(nm(S.crp));if(S.crp&&ready())l.push(tx("wt")+" "+irr(S.crp)+" "+tx("dd"));l.push(wxMsg());return l.join("\n")}
function addMsg(c,t){var d=document.createElement("div");d.className="m "+c;d.textContent=t;$("msgs").appendChild(d);$("msgs").scrollTop=1e6;return d}
function speak(t){try{var ss=window.speechSynthesis;if(!ss||!window.SpeechSynthesisUtterance){addMsg("b",tx("nov"));return}ss.cancel();var te=/[\u0C00-\u0C7F]/.test(t),u=new SpeechSynthesisUtterance(t),v=ss.getVoices().filter(function(x){return x.lang.replace("_","-").toLowerCase().indexOf(te?"te":"en")==0})[0];if(te&&!v){addMsg("b",tx("nov2"));return}if(v)u.voice=v;u.lang=v?v.lang:"en-IN";u.onerror=function(){addMsg("b",tx("nov"))};ss.speak(u)}catch(e){addMsg("b",tx("nov"))}}
function lis(d){var b=document.createElement("button");b.textContent=tx("listen");b.onclick=function(){speak(d.firstChild.textContent)};d.appendChild(b)}
function sys(){var f=(ready()?"Soil: "+S.soil+", season: "+S.sea+". ":"Soil and season not chosen. ")+(S.crp?"Crop: "+C[S.crp].n[0]+(ready()?" (fit: "+fit(S.crp).l+", water about every "+irr(S.crp)+" days)":"")+". ":"No crop chosen. ");
var w=WXD?"Live weather at Kodur: "+Math.round(WXD.current.temperature_2m)+"C now; "+wxMsg():"Weather not loaded";
return "You are a friendly farming assistant for smallholder farmers in Kodur, Andhra Pradesh. Reply in the language of the farmer's latest message (Telugu script for Telugu, including Telugu typed in English letters; English for English). App language: "+(S.L=="te"?"Telugu":"English")+". Use very simple words, at most 5 short sentences. Cover crops, irrigation, pests and weather only. Never name pesticide doses; suggest neem oil first and the Rythu Bharosa Kendram for chemicals. Farmer's field: "+f+w}
async function callAI(system,msgs,img){if(AI_URL.indexOf("http")!=0)throw 0;var r=await fetch(AI_URL,{method:"POST",body:JSON.stringify({system:system,messages:msgs,image:img||null})});var j=await r.json();if(!j.text)throw new Error(j.error||"No reply");return j.text}
async function ask(q){addMsg("u",q);H.push({role:"user",content:q});var b=addMsg("b",tx("think"));
try{var t=await callAI(sys(),H);b.textContent=t;H.push({role:"assistant",content:t})}catch(e){b.textContent=tx("fb")+"\n"+summary()+(e&&e.message?"\n\n⚠️ "+String(e.message).slice(0,160):"");H.pop()}lis(b);$("msgs").scrollTop=1e6}
function sendQ(){var v=$("q").value.trim();if(!v)return;$("q").value="";ask(v)}
function openChat(){$("chat").hidden=false;if(!$("msgs").children.length){var d=addMsg("b",tx("hello"));lis(d)}}
function shrink(f){return new Promise(function(ok,no){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8).split(",")[1])};im.onerror=no;im.src=u})}
async function scan(f){var o=$("pr");o.innerHTML='<div class="card">'+tx("scan")+"</div>";
try{var d=await shrink(f);var t=await callAI(sys()+" The farmer sent a photo of a crop leaf. Name the most likely pest or disease, give 2 simple safe steps, and say if you are unsure. Reply in "+(S.L=="te"?"Telugu":"English")+".",[{role:"user",content:"Check this leaf photo."}],{mime:"image/jpeg",data:d});
o.innerHTML='<div class="card rec" style="background:#e4f2d6;color:#14301c"><b style="font-size:17px">🐛 '+tx("poss")+'</b><p style="white-space:pre-wrap">'+esc(t)+"</p></div>"}catch(e){o.innerHTML='<div class="card" style="background:#fdf0d8;color:#6b4208">'+tx("aiNo")+"</div>"}}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
if(d.crop){S.crp=d.crop;S.hist.push({c:d.crop,d:new Date().toLocaleDateString()});S.hist=S.hist.slice(-8);go("guide")}
else if(d.go)go(d.go);
else if(d.l){var a=$("em"),p=$("pw"),ev=a?a.value:"",pv=p?p.value:"";S.L=d.l;save();draw(true);if($("em")){$("em").value=ev;$("pw").value=pv}}
else if(d.tf){S.tf=d.tf;draw(true)}
else if(d.act=="wx"){wxLoad();draw(true)}
else if(d.act=="login"||d.act=="signup"){var em=$("em").value.trim().toLowerCase(),pw=$("pw").value,ac=accs();
if(!/^\S+@\S+\.\S+$/.test(em)||pw.length<6){$("er").textContent=tx("inv");return}
if(d.act=="signup"){if(ac[em]){$("er").textContent=tx("ex");return}ac[em]=pw;try{localStorage.setItem("kf2a",JSON.stringify(ac))}catch(x){}}
else if(ac[em]!==pw){$("er").textContent=tx("bad");return}
S.user={email:em,name:em.split("@")[0]};go("home")}
else if(d.act=="guest"){S.user={guest:true,name:"Guest"};go("home")}
else if(d.act=="logout"){S.user=null;S.scr="login";save();draw()}
else if(b.id=="fab")openChat();else if(b.id=="cx"){$("chat").hidden=true;try{speechSynthesis.cancel()}catch(x){}}
else if(b.id=="send")sendQ();else if(b.parentNode.id=="sug")ask(b.textContent);
else if(b.id=="mic"){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addMsg("b",tx("nomic"));return}var r=new SR();r.lang=S.L=="te"?"te-IN":"en-IN";r.onresult=function(v){$("q").value=v.results[0][0].transcript;sendQ()};r.onerror=function(){addMsg("b",tx("nomic"))};try{r.start()}catch(x){addMsg("b",tx("nomic"))}}});
document.addEventListener("change",function(e){var i=e.target.id;
if(i=="ph"&&e.target.files[0]){scan(e.target.files[0]);return}
if(i=="soil")S.soil=e.target.value;else if(i=="sea")S.sea=e.target.value;else if(i=="crp")S.crp=e.target.value;else return;
save();draw(true)});
$("q").addEventListener("keydown",function(e){if(e.key=="Enter")sendQ()});
load();try{speechSynthesis.getVoices()}catch(e){}
S.scr="splash";draw();setTimeout(function(){go(S.user?"home":"login")},1400);
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
